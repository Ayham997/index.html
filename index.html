<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ayzo.ai — AI Voice &amp; Neural Orb</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CradialGradient id='g' cx='40%25' cy='35%25' r='65%25'%3E%3Cstop offset='0%25' stop-color='%23ffffff'/%3E%3Cstop offset='35%25' stop-color='%2338bdf8'/%3E%3Cstop offset='75%25' stop-color='%238b5cf6'/%3E%3Cstop offset='100%25' stop-color='%2304050d'/%3E%3C/radialGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='%2304050d'/%3E%3Ccircle cx='32' cy='32' r='22' fill='url(%23g)'/%3E%3Cellipse cx='32' cy='32' rx='28' ry='10' fill='none' stroke='%2338bdf8' stroke-width='2' transform='rotate(-25 32 32)'/%3E%3Cellipse cx='32' cy='32' rx='28' ry='10' fill='none' stroke='%23c084fc' stroke-width='2' transform='rotate(25 32 32)'/%3E%3C/svg%3E" />
  <style>
    :root { --bg:#04050d; --panel:rgba(13,16,36,0.72); --border:rgba(139,92,246,0.28); --text:#eef2ff; --muted:#94a3b8; --blue:#38bdf8; --electric:#3b82f6; --purple:#8b5cf6; --violet:#c084fc; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:"Inter",system-ui,sans-serif; background:radial-gradient(circle at 50% 28%,rgba(109,40,217,0.26) 0%,transparent 48%),radial-gradient(circle at 50% 34%,rgba(37,99,235,0.22) 0%,var(--bg) 72%); color:var(--text); min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:space-between; padding:16px 20px; overflow-x:hidden; }
    header { width:100%; max-width:860px; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; z-index:2; }
    .brand { letter-spacing:0.18em; font-weight:700; font-size:1.05rem; background:linear-gradient(90deg,var(--blue),var(--violet)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .status-pill { display:inline-flex; align-items:center; gap:8px; padding:6px 14px; border-radius:999px; background:var(--panel); border:1px solid var(--border); font-size:0.8rem; color:var(--muted); backdrop-filter:blur(12px); }
    .status-dot { width:8px; height:8px; border-radius:50%; background:linear-gradient(135deg,var(--blue),var(--purple)); box-shadow:0 0 12px var(--purple); transition:transform 0.25s,box-shadow 0.25s; }
    .controls-top { display:flex; gap:8px; flex-wrap:wrap; }
    .icon-btn { background:var(--panel); border:1px solid var(--border); color:var(--text); padding:7px 12px; border-radius:10px; cursor:pointer; font-size:0.82rem; backdrop-filter:blur(12px); }
    .icon-btn.live-active { border-color:var(--blue); background:rgba(56,189,248,0.2); box-shadow:0 0 16px rgba(56,189,248,0.35); }
    .orb-stage { position:relative; width:280px; height:280px; display:flex; align-items:center; justify-content:center; margin:4px 0; }
    #orbCanvas { width:280px; height:280px; cursor:pointer; }
    .orb-hint { position:absolute; bottom:4px; font-size:0.74rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted); pointer-events:none; }
    .hud { width:100%; max-width:860px; display:flex; flex-direction:column; gap:12px; z-index:2; }
    .response-card { background:var(--panel); border:1px solid var(--border); border-radius:18px; padding:16px 20px; min-height:110px; max-height:260px; overflow-y:auto; backdrop-filter:blur(18px); line-height:1.65; font-size:0.95rem; }
    .question-line { font-size:0.85rem; color:var(--blue); margin-bottom:8px; }
    .answer-body { white-space:pre-wrap; }
    .input-bar { display:flex; gap:10px; align-items:center; background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:8px 10px; backdrop-filter:blur(18px); }
    .input-bar input { flex:1; background:transparent; border:none; outline:none; color:var(--text); font-size:0.95rem; padding:6px 8px; }
    .mic-btn,.send-btn { border:none; border-radius:12px; padding:10px 16px; font-weight:600; cursor:pointer; }
    .mic-btn { background:rgba(139,92,246,0.18); color:var(--violet); border:1px solid rgba(139,92,246,0.45); }
    .mic-btn.recording { background:rgba(56,189,248,0.24); color:var(--blue); border-color:var(--blue); }
    .send-btn { background:linear-gradient(135deg,var(--electric),var(--purple)); color:#fff; }
  </style>
</head>
<body>
  <header>
    <div class="brand">Ayzo.ai</div>
    <div class="status-pill"><span class="status-dot" id="statusDot"></span><span id="statusText">Idle · Orbiting</span></div>
    <div class="controls-top">
      <button class="icon-btn" id="liveBtn">✨ Live Off</button>
      <button class="icon-btn" id="muteBtn">🔊 Male Voice On</button>
    </div>
  </header>
  <main class="orb-stage">
    <canvas id="orbCanvas" width="720" height="720"></canvas>
    <div class="orb-hint" id="orbHint">Tap orb or Live for voice</div>
  </main>
  <section class="hud">
    <div class="response-card">
      <div class="question-line" id="questionLine">Ayzo.ai Online</div>
      <div class="answer-body" id="answerBody">Tap ✨ Live for hands-free conversation, or tap Speak / type your question below.</div>
    </div>
    <form class="input-bar" id="chatForm">
      <button type="button" class="mic-btn" id="micBtn">🎙️ Speak</button>
      <input type="text" id="promptInput" placeholder="Ask Ayzo.ai anything..." autocomplete="off" />
      <button type="submit" class="send-btn">Send</button>
    </form>
  </section>
  <script>
    let orbState="idle", voiceEnabled=true, liveMode=false, currentAudio=null, isListening=false;
    const statusDot=document.getElementById("statusDot"), statusText=document.getElementById("statusText"), orbHint=document.getElementById("orbHint"), questionLine=document.getElementById("questionLine"), answerBody=document.getElementById("answerBody"), micBtn=document.getElementById("micBtn"), liveBtn=document.getElementById("liveBtn"), muteBtn=document.getElementById("muteBtn"), promptInput=document.getElementById("promptInput"), chatForm=document.getElementById("chatForm");
    const CFG={ idle:{speed:1,pulse:0.04,blue:"#38bdf8",purple:"#8b5cf6",glow:"#6366f1",label:"Idle · Orbiting"}, listening:{speed:3,pulse:0.14,blue:"#60a5fa",purple:"#c084fc",glow:"#38bdf8",label:"Listening · High Orbit"}, thinking:{speed:3.8,pulse:0.1,blue:"#3b82f6",purple:"#a855f7",glow:"#8b5cf6",label:"Thinking · Analyzing"}, speaking:{speed:3.5,pulse:0.18,blue:"#38bdf8",purple:"#d946ef",glow:"#818cf8",label:"Speaking · Active Orbit"} };
    function setOrbState(s){ orbState=s; const c=CFG[s]; statusDot.style.background=`linear-gradient(135deg,${c.blue},${c.purple})`; statusDot.style.boxShadow=`0 0 14px ${c.glow}`; statusText.textContent=liveMode&&s==="idle"?"Live · Ready":c.label; orbHint.textContent=s==="listening"?"Listening...":s==="speaking"?"Speaking... tap orb to interrupt":s==="thinking"?"Processing...":(liveMode?"Live Mode Active":"Tap orb or Live for voice"); }
    const canvas=document.getElementById("orbCanvas"), ctx=canvas.getContext("2d"), W=canvas.width, H=canvas.height, CX=W/2, CY=H/2;
    let spd=1, pls=0.04, phase=0;
    const pts=Array.from({length:48},(_,i)=>({ring:i%3,angle:(Math.PI*2*i)/16,so:0.75+(i%5)*0.18,sz:2.2+(i%3)*1.3}));
    function draw(){
      const t=CFG[orbState]; spd+=(t.speed-spd)*0.08; pls+=(t.pulse-pls)*0.08; phase+=0.018*spd; ctx.clearRect(0,0,W,H);
      const b=1+Math.sin(phase*2.2)*pls, r=104*b;
      const aura=ctx.createRadialGradient(CX,CY,r*0.25,CX,CY,r*2.5); aura.addColorStop(0,t.blue+"66"); aura.addColorStop(0.45,t.purple+"44"); aura.addColorStop(1,"transparent"); ctx.fillStyle=aura; ctx.beginPath(); ctx.arc(CX,CY,r*2.5,0,Math.PI*2); ctx.fill();
      [{rx:175,ry:60,tilt:0.36,rot:phase*0.9,color:t.blue},{rx:202,ry:68,tilt:-0.44,rot:-phase*1.15,color:t.purple},{rx:226,ry:76,tilt:1.18,rot:phase*0.7,color:"#a5b4fc"}].forEach((rg,idx)=>{
        ctx.save(); ctx.translate(CX,CY); ctx.rotate(rg.tilt+Math.sin(phase*0.35+idx)*0.12); ctx.strokeStyle=rg.color+"77"; ctx.lineWidth=orbState==="idle"?2:3.2; ctx.shadowColor=rg.color; ctx.shadowBlur=orbState==="idle"?12:24; ctx.beginPath(); ctx.ellipse(0,0,rg.rx*b,rg.ry*b,0,0,Math.PI*2); ctx.stroke();
        pts.filter(p=>p.ring===idx).forEach(p=>{ const a=p.angle+rg.rot*p.so; ctx.fillStyle=rg.color; ctx.beginPath(); ctx.arc(Math.cos(a)*rg.rx*b,Math.sin(a)*rg.ry*b,p.sz,0,Math.PI*2); ctx.fill(); }); ctx.restore();
      });
      ctx.save(); ctx.beginPath(); ctx.arc(CX,CY,r,0,Math.PI*2); ctx.clip(); ctx.fillStyle="#080a1c"; ctx.fillRect(CX-r,CY-r,r*2,r*2); ctx.globalCompositeOperation="screen";
      [{a:phase*1.1,d:0.28,c:t.blue,s:0.95},{a:-phase*0.9+2.1,d:0.3,c:t.purple,s:0.95},{a:phase*1.4+4.2,d:0.24,c:"#6366f1",s:0.85}].forEach(l=>{ const lx=CX+Math.cos(l.a)*r*l.d, ly=CY+Math.sin(l.a)*r*l.d, lg=ctx.createRadialGradient(lx,ly,0,lx,ly,r*l.s); lg.addColorStop(0,"#ffffffcc"); lg.addColorStop(0.35,l.c+"dd"); lg.addColorStop(1,"transparent"); ctx.fillStyle=lg; ctx.beginPath(); ctx.arc(lx,ly,r*l.s,0,Math.PI*2); ctx.fill(); });
      ctx.restore(); ctx.save(); ctx.strokeStyle="rgba(196,181,253,0.45)"; ctx.lineWidth=2; ctx.shadowColor=t.purple; ctx.shadowBlur=orbState==="idle"?28:55; ctx.beginPath(); ctx.arc(CX,CY,r,0,Math.PI*2); ctx.stroke(); ctx.restore();
      requestAnimationFrame(draw);
    }
    draw();
    function resumeLive(){ if(liveMode&&rec&&!isListening) setTimeout(()=>{ if(liveMode&&!isListening&&orbState!=="thinking") try{rec.start();}catch(_){} },250); }
    function stopAudio(){ if(currentAudio){currentAudio.pause(); currentAudio=null;} window.speechSynthesis?.cancel(); }
    function speak(text,b64,mime){
      if(!voiceEnabled){ setOrbState("idle"); resumeLive(); return; }
      stopAudio();
      if(b64){ const a=new Audio(`data:${mime};base64,${b64}`); currentAudio=a; setOrbState("speaking"); a.onended=()=>{setOrbState("idle");resumeLive();}; a.onerror=()=>fallbackTTS(text); a.play().catch(()=>fallbackTTS(text)); }
      else fallbackTTS(text);
    }
    function fallbackTTS(text){
      if(!("speechSynthesis" in window)){ setOrbState("idle"); resumeLive(); return; }
      const u=new SpeechSynthesisUtterance(text.replace(/[*_`#]/g,"")); u.pitch=0.88;
      u.onstart=()=>setOrbState("speaking"); u.onend=()=>{setOrbState("idle");resumeLive();}; u.onerror=()=>{setOrbState("idle");resumeLive();}; window.speechSynthesis.speak(u);
    }
    async function ask(text){
      setOrbState("thinking"); questionLine.textContent=`You: ${text}`; answerBody.textContent="Thinking...";
      const fd=new FormData(); fd.append("prompt",text); fd.append("model","gemini-3.5-flash-lite"); fd.append("voice_output",String(voiceEnabled));
      try{ const res=await fetch("/api/chat",{method:"POST",body:fd}); const d=await res.json(); if(!res.ok) throw new Error(d.detail||"Request failed"); answerBody.textContent=d.answer; speak(d.answer,d.audio_base64,d.audio_mime); }
      catch(e){ answerBody.textContent=`Error: ${e.message}`; setOrbState("idle"); resumeLive(); }
    }
    muteBtn.onclick=()=>{ voiceEnabled=!voiceEnabled; muteBtn.textContent=voiceEnabled?"🔊 Male Voice On":"🔇 Muted"; if(!voiceEnabled){stopAudio();setOrbState("idle");} };
    chatForm.onsubmit=(e)=>{ e.preventDefault(); const t=promptInput.value.trim(); if(!t)return; promptInput.value=""; ask(t); };
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition; let rec=null;
    if(SR){
      rec=new SR(); rec.lang="en-US";
      rec.onstart=()=>{ isListening=true; setOrbState("listening"); micBtn.classList.add("recording"); micBtn.textContent="⏹️ Listening"; };
      rec.onresult=(e)=>ask(e.results[0][0].transcript);
      rec.onerror=(e)=>{ isListening=false; if(liveMode&&e.error==="no-speech"){resumeLive();return;} liveMode=false; liveBtn.textContent="✨ Live Off"; liveBtn.classList.remove("live-active"); setOrbState("idle"); };
      rec.onend=()=>{ isListening=false; micBtn.classList.remove("recording"); micBtn.textContent="🎙️ Speak"; if(orbState==="listening")setOrbState("idle"); };
    }
    liveBtn.onclick=()=>{ if(!rec)return; liveMode=!liveMode; liveBtn.textContent=liveMode?"🟢 Live On":"✨ Live Off"; liveBtn.classList.toggle("live-active",liveMode); if(liveMode){stopAudio();if(!isListening)try{rec.start();}catch(_){}}else{stopAudio();if(isListening)rec.stop();setOrbState("idle");} };
    function toggleMic(){ if(!rec)return; if(orbState==="speaking"){stopAudio();try{rec.start();}catch(_){}return;} if(isListening)rec.stop(); else{stopAudio();rec.start();} }
    micBtn.onclick=toggleMic; canvas.onclick=toggleMic;
  </script>
</body>
</html>
