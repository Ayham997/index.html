<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kallal — AI Voice &amp; Neural Orb</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CradialGradient id='g' cx='40%25' cy='35%25' r='65%25'%3E%3Cstop offset='0%25' stop-color='%23ffffff'/%3E%3Cstop offset='35%25' stop-color='%2338bdf8'/%3E%3Cstop offset='75%25' stop-color='%238b5cf6'/%3E%3Cstop offset='100%25' stop-color='%2304050d'/%3E%3C/radialGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='%2304050d'/%3E%3Ccircle cx='32' cy='32' r='22' fill='url(%23g)'/%3E%3Cellipse cx='32' cy='32' rx='28' ry='10' fill='none' stroke='%2338bdf8' stroke-width='2' transform='rotate(-25 32 32)'/%3E%3Cellipse cx='32' cy='32' rx='28' ry='10' fill='none' stroke='%23c084fc' stroke-width='2' transform='rotate(25 32 32)'/%3E%3C/svg%3E" />
  <style>
    :root { --bg:#04050d; --panel:rgba(13,16,36,0.72); --border:rgba(139,92,246,0.28); --text:#eef2ff; --muted:#94a3b8; --blue:#38bdf8; --electric:#3b82f6; --purple:#8b5cf6; --violet:#c084fc; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:"Inter",system-ui,sans-serif; background:radial-gradient(circle at 50% 28%,rgba(109,40,217,0.26) 0%,transparent 48%),radial-gradient(circle at 50% 34%,rgba(37,99,235,0.22) 0%,var(--bg) 72%); color:var(--text); min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:space-between; padding:16px 20px; overflow-x:hidden; }
    header { width:100%; max-width:860px; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; z-index:2; }
    .brand { letter-spacing:0.22em; font-weight:700; font-size:1rem; background:linear-gradient(90deg,var(--blue),var(--violet)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; text-transform:uppercase; }
    .status-pill { display:inline-flex; align-items:center; gap:8px; padding:6px 14px; border-radius:999px; background:var(--panel); border:1px solid var(--border); font-size:0.8rem; color:var(--muted); backdrop-filter:blur(12px); }
    .status-dot { width:8px; height:8px; border-radius:50%; background:linear-gradient(135deg,var(--blue),var(--purple)); box-shadow:0 0 12px var(--purple); transition:transform 0.25s,box-shadow 0.25s; }
    .controls-top { display:flex; gap:8px; flex-wrap:wrap; }
    .icon-btn { background:var(--panel); border:1px solid var(--border); color:var(--text); padding:7px 12px; border-radius:10px; cursor:pointer; font-size:0.82rem; backdrop-filter:blur(12px); }
    .icon-btn.live-active { border-color:var(--blue); background:rgba(56,189,248,0.2); box-shadow:0 0 16px rgba(56,189,248,0.35); }
    .orb-stage { position:relative; width:280px; height:280px; display:flex; align-items:center; justify-content:center; margin:4px 0; }
    #orbCanvas { width:280px; height:280px; cursor:pointer; }
    .orb-hint { position:absolute; bottom:4px; font-size:0.74rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted); pointer-events:none; }
    .hud { width:100%; max-width:860px; display:flex; flex-direction:column; gap:12px; z-index:2; }
    .response-card { background:var(--panel); border:1px solid var(--border); border-radius:18px; padding:16px 20px; min-height:110px; max-height:260px; overflow-y:auto; backdrop-filter:blur(18px); line-height:1.65; font-size:0.95rem; }
    .question-line { font-size:0.85rem; color:var(--blue); margin-bottom:8px; }
    .answer-body { white-space:pre-wrap; }
    .input-bar { display:flex; gap:10px; align-items:center; background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:8px 10px; backdrop-filter:blur(18px); }
    .input-bar input { flex:1; background:transparent; border:none; outline:none; color:var(--text); font-size:0.95rem; padding:6px 8px; }
    .mic-btn,.send-btn { border:none; border-radius:12px; padding:10px 16px; font-weight:600; cursor:pointer; }
    .mic-btn { background:rgba(139,92,246,0.18); color:var(--violet); border:1px solid rgba(139,92,246,0.45); }
    .mic-btn.recording { background:rgba(56,189,248,0.24); color:var(--blue); border-color:var(--blue); }
    .send-btn { background:linear-gradient(135deg,var(--electric),var(--purple)); color:#fff; }
  </style>
</head>
